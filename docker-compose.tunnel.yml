# Gives the skill a public HTTPS address through ngrok, with no router or
# certificate setup. Reads NGROK_AUTHTOKEN and NGROK_DOMAIN from .env.
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
services:
  tunnel:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN}", "alexa-cats:8080"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      alexa-cats:
        condition: service_healthy
